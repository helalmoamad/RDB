name: Deploy to Play Store Internal

on:
  push:
    branches:
      - main  # سيشتغل هذا الـ Pipeline تلقائياً عندما ترفع كود لفرع main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      #    fetch-depth: 0 يجلب التاريخ كاملاً — يحتاجه فحص الأسرار أدناه، فبعمق
      #    ضحل يفحص آخر commit فقط ويفوته أي سرّ أُضيف ثم حُذف لاحقاً.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 2. فحص الأسرار في تاريخ Git كاملاً — يوقف البناء قبل أي شيء آخر
      #
      #    نشغّل الملف التنفيذي مباشرةً بدل gitleaks-action لأن الأخير يتطلّب
      #    GITLEAKS_LICENSE مدفوعاً للمستودعات الخاصة والمؤسسية.
      #    الاستثناءات وتبريرها في .gitleaks.toml (يُلتقط تلقائياً).
      - name: Secret Scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # --redact: لا تُطبع قيمة أي سرّ في سجلّات الإجراء (السجلّات تبقى
          # مقروءة لكل من يملك وصولاً للمستودع).
          /tmp/gitleaks detect --source . --redact --verbose

      # 3. تثبيت الجافا
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. تثبيت فلاتر
      # مثبّت على إصدار محدد عمداً: بدون flutter-version يأخذ الرَنَر أحدث stable
      # في ذلك اليوم، فينكسر البناء في صباح لم تغيّر فيه سطراً واحداً. يجب أن
      # تبقى هذه القيمة مطابقة لـ Flutter المحلي، وتُغيَّر في نفس التذكرة.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      # 5. تحميل مكاتب فلاتر
      - name: Install Dependencies
        run: flutter pub get

      # 6. 🔥 توليد ملف الـ .env بالروابط العادية ومفاتيح السيكرتس بأمان
      #
      #    .env غير متتبَّع في Git عمداً، لكنه مُعلَن كـ asset في pubspec.yaml
      #    فبدونه يفشل flutter build على رَنَر نظيف.
      #
      #    الروابط العامة تُكتب هنا نصاً صريحاً؛ أي مفتاح أو اعتماد يأتي من
      #    repository secret (Settings -> Secrets and variables -> Actions).
      #    القيمة الملصوقة هنا يقرأها كل من يرى المستودع، وتبقى في تاريخ Git
      #    حتى بعد حذفها.
      #
      #    ملاحظة: هذه قيم بيئة التطوير. عند فتح مسار إنتاج يجب أن تتفرّع هذه
      #    الخطوة حسب الفرع/البيئة بدل تثبيت روابط dev في نسخة إنتاجية.
      - name: Create .env file dynamically
        run: |
          cat <<'EOF' > .env
          WALLET_URL="https://trydos_wallet_develop.ramaaz.dev"
          KYC_URL="https://rdb-kyc-worker.yazan-adnof.workers.dev"
          PASSKEY_URL="https://dev.ramaaz-digital-bank.online"
          CLOUDINARY_URL="https://api.cloudinary.com"
          CLOUDINARY_NAME="djooohujg"
          CLOUDINARY_VERSION="v1_1"
          CLOUDINARY_LOAD_PRESET="v4h8xqns"
          POSTHOG_API_KEY="${{ secrets.POSTHOG_API_KEY }}"
          POSTHOG_HOST="https://us.i.posthog.com"
          DEEPLINK_ALLOWED_HOSTS="staging-ramaaz-digital-banking.yazan-adnof.workers.dev"
          EOF

      # 7. تشغيل اختبارات فلاتر (تم تعطيلها مؤقتاً)
      # - name: Run Flutter Tests
      #   run: flutter test

      # 8. تحويل النص المشفر إلى ملف مفتاح حقيقي داخل سيرفر GitHub
      #    السرّ يُمرَّر عبر env لا بالحقن المباشر في run: قيمة محقونة بـ ${{ }}
      #    داخل السكربت يفسّرها الشِل، ويفشل الأمر بصمت إن احتوت محرفاً خاصاً.
      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::السرّ ANDROID_KEYSTORE_BASE64 غير مضبوط."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks

      # 9. بناء التطبيق وتمرير أرقام الإصدارات تلقائياً
      - name: Build App Bundle
        env:
          # android/gradle.properties مضبوط على جهاز التطوير (7.9 GB). رَنَر
          # ubuntu-latest يملك 16 GB ويبني bundleRelease، فنمنحه حجمه الخاص هنا
          # بدل وراثة قياس جهاز آخر. GRADLE_OPTS تتجاوز gradle.properties.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dkotlin.daemon.jvmargs=-Xmx2g
          ANDROID_KEYSTORE_PATH: "upload-keystore.jks"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUM=$((${{ github.run_number }} + 20))
          flutter build appbundle --release --build-number=$BUILD_NUM

      # 10. الرفع تلقائياً إلى المسار الداخلي بالمتجر (Internal Testing)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.rdb.www
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed