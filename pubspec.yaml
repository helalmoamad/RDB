name: rdb
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+18

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  passkeys: ^2.19.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  trydos_wallet:
    git:
        url: https://github.com/helalmoamad/trydos_wallet.git
        ref: main
  flutter_svg: ^2.0.10+1
  tuple: ^2.0.2
  device_info_plus: ^12.4.0
  country_flags: ^2.1.1
  intl: ^0.20.2
  #cached_network_image: ^3.2.3
  easy_localization: ^3.0.3
  flutter_launcher_icons: ^0.13.1
  fluttertoast: ^8.2.12
  dartz: ^0.10.1
  equatable: ^2.0.5
  go_router: ^12.0.0
  shimmer: ^3.0.0
  eraser: ^3.0.0
  flutter_countdown_timer: ^4.1.0
  url_launcher: ^6.1.14
  flutter_bloc: ^8.1.3
  share_plus: ^12.0.1
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.1
  cupertino_back_gesture: ^0.1.0
  firebase_messaging: ^14.7.10
  bot_toast: ^4.1.3
  firebase_analytics: ^10.8.0
  #flutter_cache_manager: ^3.3.1
  uuid: ^4.3.5
  crypto: ^3.0.3
  permission_handler: ^11.0.1
  flutter_local_notifications: ^19.5.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  get_it: ^7.6.4
  injectable: ^2.6.0
  logger: ^2.4.0
  flutter_spinkit: ^5.2.0
  bloc_concurrency: ^0.2.2
  dio: ^5.7.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  connectivity_plus: ^6.1.5
  root_check_flutter: ^1.0.5
  http: ^1.2.1
  app_links: ^6.4.0
  local_auth: ^2.3.0
  camera: ^0.11.1
  dotted_border: ^2.1.0
  form_field_validator: ^1.1.0
 
  dio_http2_adapter: ^2.5.3
  #flutter_svg_image: ^1.1.0+1
  #lottie: 2.7.0
  vibration: ^3.1.3
  hydrated_bloc: ^9.1.5
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  # flutter_osm_plugin: ^1.3.6
  firebase_core: ^2.32.0
  firebase_database: ^10.5.7
  sync: ^0.3.0
  posthog_flutter: 5.24.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^2.9.1
  build_runner: ^2.4.8
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/svg/
    - assets/languages/
    - assets/fonts/SF_Pro_text/
    - assets/fonts/SF_Pro_Display/
    - assets/fonts/SF_Pro_Rounded/
    - assets/fonts/adobe_clean/
    - assets/fonts/Quicksand/
    - .env
  
  fonts:
    - family: SF-Pro-Text-Regular
      fonts:
        - asset: assets/fonts/SF_Pro_text/SF-Pro-Text-Regular.otf
    - family: SF-Pro-Text-Semibold
      fonts:
        - asset: assets/fonts/SF_Pro_text/SF-Pro-Text-Semibold.otf
    - family: SF-Pro-Display-Light
      fonts:
        - asset: assets/fonts/SF_Pro_Display/SF-Pro-Display-Light.otf
    - family: SF-Pro-Display-Semibold
      fonts:
        - asset: assets/fonts/SF_Pro_Display/SF-Pro-Display-Semibold.otf
    - family: SF-Pro-Display-Thin
      fonts:
        - asset: assets/fonts/SF_Pro_Display/SF-Pro-Display-Thin.otf
    - family: SF-Pro-Display-Bold
      fonts:
        - asset: assets/fonts/SF_Pro_Display/SF-Pro-Display-Regular.otf
    - family: SF-Pro-Display-Regular
      fonts:
        - asset: assets/fonts/SF_Pro_Display/SF-Pro-Display-Regular.otf
    - family: SF-Pro-Rounded-Light
      fonts:
        - asset: assets/fonts/SF_Pro_Rounded/SF-Pro-Rounded-Light.otf
    - family: SF-Pro-Rounded-Regular
      fonts:
        - asset: assets/fonts/SF_Pro_Rounded/SF-Pro-Rounded-Regular.otf
    - family: SF-Pro-Rounded-Medium
      fonts:
        - asset: assets/fonts/SF_Pro_Rounded/SF-Pro-Rounded-Medium.otf
    - family: SF-Pro-Rounded-Bold
      fonts:
        - asset: assets/fonts/SF_Pro_Rounded/SF-Pro-Rounded-Bold.otf
    - family: AdobeCleanLight
      fonts:
        - asset: assets/fonts/adobe_clean/AdobeCleanLight.otf
    - family: AdobeCleanRegular
      fonts:
        - asset: assets/fonts/adobe_clean/AdobeCleanRegular.otf
    - family: AdobeCleanBold
      fonts:
        - asset: assets/fonts/adobe_clean/AdobeCleanBold.otf
    - family: Quicksand-Regular
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Regular.ttf
    - family: Quicksand-Medium
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Medium.ttf
    - family: Quicksand-Bold
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Bold.ttf
    - family: Quicksand-Light
      fonts:
        - asset: assets/fonts/Quicksand/Quicksand-Light.ttf

