# أحجام الذاكرة مضبوطة على الجهاز الفعلي (\u200F7.9 GB RAM / 4 vCPU) وليس على الرغبة.
# مهم: إن تُرك kotlin.daemon.jvmargs فارغاً فإن Kotlin daemon يرث org.gradle.jvmargs
# — فتتحول 8G إلى 16G مطلوبة من جهاز يملك 8G، فيتباطأ البناء ويتقطّع.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m

# Kotlin 2.3 يخزّن مسارات المصادر في الكاش التزايدي **نسبةً لجذر المشروع**
# (RelocatableFileToPathConverter). المستودع هنا على D: بينما pub cache على C:،
# ولا يوجد مسار نسبي بين قرصين في ويندوز → File.relativeTo يرمي
# IllegalArgumentException: "this and base files have different roots" أثناء إغلاق
# الكاش، فيفشل تجميع أي إضافة (مصادرها في C:) برسالة مضلّلة عن "incremental caches".
# الحل الجذري: نقل PUB_CACHE إلى D: ثم حذف هذا السطر.
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
